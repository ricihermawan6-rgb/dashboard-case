<body>

<h2>Test Database</h2>

<input id="name" placeholder="Nama">
<button onclick="tambah()">Tambah</button>

<ul id="list"></ul>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const sb = window.supabase.createClient(
  "https://jpbbrqlcraxtnekkvdat.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYmJycWxjcmF4dG5la2t2ZGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDkxNTIsImV4cCI6MjA5MTQyNTE1Mn0.hY6vubnD9RS-iFsxZ0zsy5xVVnqhX6XtUOGY58NXJMY"
);

// TAMBAH DATA
async function tambah() {
  const name = document.getElementById("name").value;

  await sb.from('cases').insert([
    { name: name, status: "aktif" }
  ]);

  load();
}

// LOAD DATA
async function load() {
  const { data } = await sb.from('cases').select('*');

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    list.innerHTML += `<li>${item.name} - ${item.status}</li>`;
  });
}

// AUTO LOAD
load();
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">CaseTrack — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d14;
    --surface: #111520;
    --surface2: #171d2e;
    --border: #1e2740;
    --accent: #e8c547;
    --accent2: #4e9af1;
    --danger: #f1654e;
    --success: #4ecf8a;
    --warning: #f1a94e;
    --text: #e8eaf2;
    --muted: #6b7494;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
    --sidebar-w: 240px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* === SIDEBAR === */
  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 100;
    transition: width .2s;
  }

  .logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    font-family: var(--display);
    font-weight: 800;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: #0a0d14;
    flex-shrink: 0;
    font-weight: 800;
    font-family: var(--display);
    overflow: hidden;
  }
  .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .nav { padding: 16px 12px; flex: 1; overflow-y: auto; }
  .nav-label {
    font-size: 9px;
    letter-spacing: 2.5px;
    color: var(--muted);
    text-transform: uppercase;
    font-family: var(--mono);
    padding: 12px 12px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--muted);
    transition: all .15s;
    margin-bottom: 2px;
    position: relative;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(232,197,71,.1); color: var(--accent); }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-family: var(--mono);
    padding: 1px 6px;
    border-radius: 20px;
    font-weight: 500;
  }

  .sidebar-footer {
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .user-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    background: var(--surface2);
    cursor: pointer;
    transition: background .15s;
  }
  .user-card:hover { background: rgba(232,197,71,.08); }
  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #c9a32e);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #0a0d14;
    font-family: var(--display);
    overflow: hidden;
    flex-shrink: 0;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-name { font-size: 12.5px; font-weight: 500; }
  .user-role { font-size: 10px; color: var(--muted); font-family: var(--mono); }
  .user-role-pill {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 10px;
    font-family: var(--mono);
    font-weight: 600;
    margin-left: 4px;
  }
  .pill-super { background: rgba(232,197,71,.2); color: var(--accent); }
  .pill-admin { background: rgba(78,154,241,.2); color: var(--accent2); }
  .pill-viewer { background: rgba(107,116,148,.2); color: var(--muted); }

  /* === MAIN === */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky; top: 0; z-index: 50;
  }

  .page-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }
  .page-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  .btn {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: var(--sans);
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #0a0d14;
    font-weight: 700;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger {
    background: rgba(241,101,78,.15);
    color: var(--danger);
    border: 1px solid rgba(241,101,78,.3);
  }
  .btn-danger:hover { background: rgba(241,101,78,.25); }
  .btn-success {
    background: rgba(78,207,138,.15);
    color: var(--success);
    border: 1px solid rgba(78,207,138,.3);
  }
  .btn-sm { padding: 5px 10px; font-size: 11.5px; }

  .content { padding: 28px 32px; flex: 1; }

  /* === PAGES === */
  .page { display: none; }
  .page.active { display: block; }

  /* === STAT CARDS === */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }
  .stat-card:hover { border-color: #2a3352; }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.red::before { background: var(--danger); }
  .stat-card.yellow::before { background: var(--accent); }
  .stat-card.blue::before { background: var(--accent2); }
  .stat-card.green::before { background: var(--success); }

  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-family: var(--mono); }
  .stat-value { font-family: var(--display); font-size: 36px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -1px; }
  .stat-delta { font-size: 12px; color: var(--muted); }
  .stat-delta span { font-weight: 600; }
  .stat-delta .up { color: var(--danger); }
  .stat-delta .down { color: var(--success); }
  .stat-icon { position: absolute; top: 18px; right: 18px; font-size: 22px; opacity: .15; }

  /* === FILTER BAR === */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px 9px 36px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }

  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .filter-select:focus { border-color: var(--accent); }
  .filter-select option { background: var(--surface2); }

  /* === TABLE === */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .table-title { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .table-count { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 11px 16px;
    font-size: 10.5px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 13px 16px;
    font-size: 13px;
    border-bottom: 1px solid rgba(30,39,64,.5);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  .employee-cell { display: flex; align-items: center; gap: 10px; }
  .emp-avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--display);
    flex-shrink: 0;
  }
  .emp-name { font-weight: 500; font-size: 13.5px; }
  .emp-id { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: .3px;
  }
  .badge-red { background: rgba(241,101,78,.15); color: #f4806b; border: 1px solid rgba(241,101,78,.25); }
  .badge-yellow { background: rgba(232,197,71,.15); color: #e8c547; border: 1px solid rgba(232,197,71,.25); }
  .badge-blue { background: rgba(78,154,241,.15); color: #6aaaf5; border: 1px solid rgba(78,154,241,.25); }
  .badge-green { background: rgba(78,207,138,.15); color: #5fd99b; border: 1px solid rgba(78,207,138,.25); }
  .badge-gray { background: rgba(107,116,148,.15); color: #8b96ba; border: 1px solid rgba(107,116,148,.25); }
  .badge-purple { background: rgba(167,139,250,.15); color: #a78bfa; border: 1px solid rgba(167,139,250,.25); }

  .severity-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-red { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .dot-yellow { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot-blue { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }

  .date-text { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  .action-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    padding: 5px 10px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: var(--sans);
    transition: all .15s;
    margin-right: 4px;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.view:hover { border-color: var(--accent2); color: var(--accent2); }
  .action-btn.del:hover { border-color: var(--danger); color: var(--danger); }
  /* Inline status select */
  .inline-status-sel { background:transparent; border:1px solid var(--border); border-radius:20px; color:var(--text); font-family:var(--mono); font-size:10.5px; cursor:pointer; outline:none; padding:2px 8px; font-weight:600; transition:border-color .15s; }
  .inline-status-sel:hover { border-color:var(--accent); }
  .inline-status-sel option { background:var(--surface2); color:var(--text); }


  /* === BOTTOM GRID === */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .card-body { padding: 16px 20px; }

  /* === TIMELINE === */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item:last-child .tl-line { display: none; }
  .tl-left { display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .tl-line { width: 1px; flex: 1; background: var(--border); margin-top: 4px; }
  .tl-content { flex: 1; }
  .tl-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .tl-sub { font-size: 11.5px; color: var(--muted); }
  .tl-time { font-size: 10.5px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

  /* === CASE TYPE BARS === */
  .case-type-list { display: flex; flex-direction: column; gap: 14px; }
  .ct-label { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .ct-name { font-size: 13px; font-weight: 400; }
  .ct-count { font-size: 12px; font-family: var(--mono); color: var(--muted); }
  .ct-bar { height: 5px; background: var(--surface2); border-radius: 10px; overflow: hidden; }
  .ct-fill { height: 100%; border-radius: 10px; }

  /* === MODAL === */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 600px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-head {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .modal-title { font-family: var(--display); font-weight: 700; font-size: 16px; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .modal-close:hover { color: var(--text); background: var(--surface2); }
  .modal-body { padding: 24px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1/-1; }
  .form-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-family: var(--mono); }
  .form-input, .form-select, .form-textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-select option { background: var(--surface2); }

  .modal-foot {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    position: sticky;
    bottom: 0;
    background: var(--surface);
  }

  /* === DETAIL PANEL === */
  .detail-section { margin-bottom: 20px; }
  .detail-section-title {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    font-family: var(--mono);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail-key { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-family: var(--mono); }
  .detail-val { font-size: 13.5px; font-weight: 500; }

  .update-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .update-item:last-child { border-bottom: none; }
  .update-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .update-text { font-size: 13px; }
  .update-meta { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

  /* === SP TRACKER === */
  .sp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .sp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .sp-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .sp-card.sp1::before { background: var(--warning); }
  .sp-card.sp2::before { background: var(--danger); }
  .sp-card.sp3::before { background: #dc2626; }
  .sp-label { font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 1.5px; }
  .sp-value { font-family: var(--display); font-size: 40px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -2px; }
  .sp-desc { font-size: 11.5px; color: var(--muted); }

  .sp-table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .sp-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
  }
  .sp-badge.sp1 { background: rgba(241,169,78,.15); color: var(--warning); border: 1px solid rgba(241,169,78,.3); }
  .sp-badge.sp2 { background: rgba(241,101,78,.15); color: var(--danger); border: 1px solid rgba(241,101,78,.3); }
  .sp-badge.sp3 { background: rgba(220,38,38,.2); color: #ef4444; border: 1px solid rgba(220,38,38,.35); }

  /* === UPLOAD ZONE === */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: var(--surface2);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232,197,71,.05);
  }
  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: var(--muted); }
  .upload-text strong { color: var(--accent); }
  .upload-hint { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 6px; }

  .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background:
